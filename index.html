<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <title>2nd Quarter | SW #1</title>
</head>
<style>
      body {
        font-family: Georgia, sans-serif;
        background-image: url(https://i.pinimg.com/1200x/a1/a7/d4/a1a7d4aeb4411c17aae2f5cae83cc5ee.jpg);
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
      }
    </style>
<body>
    <div class="container mt-5">
        <h3 class="mb-4"> Entering The Poke World </h3>
        <form class="mb-4">
            <div class="mb-3">
                <input type="text" id="first_name" class="form-control" placeholder="Enter the first name">
            </div>
            <div class="mb-3">
                <input type="text" id="last_name" class="form-control" placeholder="Enter the last name">
            </div>
            <input type="button" value="Submit" py-click="add_member" class="btn btn-primary">
        </form>
        <div id="output" class="p-3 rounded" style="background-color: rgb(37, 44, 241); color: rgb(147, 230, 65); font-size: 20px;"></div>
    </div>

    <py-script src="main.py"></py-script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
